# Smilyai-labs CodVa-1-Small -- custom `codva1` architecture (trust_remote_code).
#
#   python run_atlas.py --model codva1
#
# Dense/MoE-alternating code model: 28 layers, d_model 1536, MoE every 2nd
# layer (16 experts top-2 + 2 shared). The residual stream is a plain
# [B, S, 1536] tensor, so SAE capture is unaffected by the MoE layers.

model_id: Smilyai-labs/CodVa-1-Small
hf_sae_repo: juiceb0xc0de/CodVa-1-Small-sae-atlas
wandb_project: null

trust_remote_code: true

architecture:
  n_layers: 28      # config aliases num_hidden_layers; pinned anyway
  d_in: 1536

# Code model (FIM-trained), so activations come from a code corpus, not
# FineWeb-Edu prose. The prefix is the model's own domain tag -- every
# sequence starts the way the authors' prompts do.
corpus:
  id: bigcode/the-stack-smol
  text_field: content
  prefix: "<|domain_code|>"

defaults:
  # Custom forward: no output_hidden_states support, non-standard module
  # names. `auto` capture detects this and falls back to forward hooks.
  capture: auto
  expansion: 32
  pool_batches: 500
  max_steps: 5000
  target_l0: 50
  microbatch_tokens: 32768

env:
  SAE_TIMING: "1"

notes: |
  Their modeling file prints a usage banner at import time -- expect it in
  the logs, it is harmless.

  The model ignores output_hidden_states (returns hidden_states=None), which
  is why capture must be `auto` (hook fallback). rolling-hf does not apply:
  module names are non-standard (embed vs embed_tokens) and blocks return
  bare tensors.

  max_len is 2048 == trainer SEQ_LEN; do not raise SEQ_LEN for this model.

  Disk: ~111GB per 500-batch pool at d_in=1536, plus one resume copy.

caveats:
  corpus_note: >
    Activations captured from bigcode/the-stack-smol with a <|domain_code|>
    prefix; features reflect the code domain, not general text.
