model_id: google/gemma-4-E2B-it

hf_sae_repo: juiceb0xc0de/gemma-4-e2b-it-SAE
hf_repo_type: dataset
wandb_project: gemma-4-e2b-SAE

architecture:
  n_layers: null
  d_in: null

defaults:
  capture: rolling-float
  expansion: 32
  pool_batches: 500
  pool_forward_fusion: 2
  max_steps: 5000
  target_l0: 50
  microbatch_tokens: 32768
  pool_retention: 3

corpus:
  id: HuggingFaceFW/fineweb-edu
  text_field: text
  prefix: ""

env:
  SAE_TIMING: "250"

notes: |
  Gemma-4-E2B-it uses the Gemma-specific rolling capture backend.
  Model weights, activation pools, checkpoints, and caches live under /workspace.
  Post-boundary layers hoist their fixed KV-producing dependency alongside the
  current block and rebuild shared KV from retained anchor activation pools.

caveats:
  corpus_note: >
    SAE training activations are sampled from FineWeb-Edu, so the resulting
    feature distribution reflects that corpus.
